name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-lmodern lmodern

      - name: Install project fonts (static instances from variable fonts)
        run: bash scripts/ci-install-fonts.sh

      - name: Install Python dependencies
        run: |
          python3 -m pip install --quiet --break-system-packages pypdf pillow fonttools 2>/dev/null \
            || python3 -m pip install --quiet --user pypdf pillow fonttools 2>/dev/null \
            || pip install --quiet pypdf pillow fonttools

      - name: Run regression suite (25 tests)
        run: python3 tests/run_tests.py .

      - name: Build sample (autofit golden path)
        run: |
          python3 build.py examples/plates/ examples/sample.tex \
            --docopts "paper=a3,landscape,columns=3,plates=1"
          python3 pdfcheck.py examples/sample.pdf --log examples/sample.log \
            --paper a3 --landscape --pages 2
